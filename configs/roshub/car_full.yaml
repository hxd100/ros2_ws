# 对应 ~/ros2_ws 的 tb6612_car 包
car_full:
  description: 实车全套（底盘桥接 + 机器人模型 + 雷达 + 深度相机）
  meta:
    robot: TB6612 双轮差速小车
    project_type: single_robot
    simulator: none
    rmw: rmw_fastrtps_cpp
    mode: robust
    workspace: ${HOME}/ros2_ws
    tags: [tb6612, 实车]
    motion:
      topic: /cmd_vel
      type: Twist
      verified: false
  env:
    RMW_IMPLEMENTATION: rmw_fastrtps_cpp
  runbook:
  - id: bringup
    title: 启动实车全套
    run:
      cmd: source ${HOME}/ros2_ws/install/setup.bash && ros2 launch tb6612_car real_bringup.launch.py
      bg: true
    ready:
    - nodes: car_bridge
      min: 1
    - hz: /odom
      min_hz: 10
    - hz: /scan
      min_hz: 2
    timeout: 90
    hint: 需要电机电池上电并接好串口；否则 /odom 不会出数据
  contracts:
  - {topic: /cmd_vel, expected_type: geometry_msgs/msg/Twist, role: 速度指令}
  - {topic: /odom, expected_type: nav_msgs/msg/Odometry, role: 里程计}
  - {topic: /scan, expected_type: sensor_msgs/msg/LaserScan, role: 激光雷达}
  controls:
  - id: stop
    label: 停车
    cmd: 'ros2 topic pub -1 /cmd_vel geometry_msgs/msg/Twist "{linear: {x: 0.0, y: 0.0, z: 0.0}, angular: {x: 0.0, y: 0.0, z: 0.0}}"'
  - id: fwd
    label: 前进 0.2 m/s × 2s
    cmd: 'timeout 2 ros2 topic pub -r 10 /cmd_vel geometry_msgs/msg/Twist "{linear: {x: 0.2, y: 0.0, z: 0.0}, angular: {x: 0.0, y: 0.0, z: 0.0}}"'
  - id: left
    label: 原地左转 × 2s
    cmd: 'timeout 2 ros2 topic pub -r 10 /cmd_vel geometry_msgs/msg/Twist "{linear: {x: 0.0, y: 0.0, z: 0.0}, angular: {x: 0.0, y: 0.0, z: 0.5}}"'
